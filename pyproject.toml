[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["segment3D"]

[project]
name = "u-Segment3D"
description = "Generate consensus 3D segmentation from 2D segmented stacks"
authors = [{name = "Felix Y. Zhou", email = "felixzhou1@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
version = "0.1.3"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

requires-python = ">=3.9, <3.13"
dependencies = [
    "numpy<2.0",
    "pyarrow<21",
    "cellpose<4.0",
    "dask[complete]",
    "scikit-image",
    "scikit-learn",
    "imagecodecs<2025",
    "contourpy<=1.2.0",
    "opencv-python-headless",
    "scipy",
    "numba",
    "matplotlib",
    "seaborn",
    "trimesh",
    "multiprocess",
    "tiler",
    "connected-components-3d",
    "edt",
    "tqdm",
    "scikit-fmm; sys_platform==\"win32\"",
    "czifile",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda11x; sys_platform!=\"darwin\"",
]
dev = [
    "build",
    "pytest",
    "twine",
]
all = [
    "cupy-cuda11x; sys_platform!=\"darwin\"",
    "build",
    "pytest",
    "twine",
]

[project.urls]
Homepage = "https://github.com/DanuserLab/u-segment3D"
Issues = "https://github.com/DanuserLab/u-segment3D/issues"

